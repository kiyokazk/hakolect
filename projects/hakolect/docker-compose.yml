version: '3.8'

services:
  hakolect-api:
    build: ./backend
    env_file: .env
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/hakolect/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  hakolect-frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    depends_on:
      - hakolect-api
