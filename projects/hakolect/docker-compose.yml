version: '3.8'

services:
  hakolect-api:
    build: ./backend
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/hakolect/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hakolect-frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - hakolect-api
