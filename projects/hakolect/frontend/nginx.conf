server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve /hakolect/* with SPA fallback
    location /hakolect/ {
        alias /usr/share/nginx/html/hakolect/;
        try_files $uri $uri/ /hakolect/index.html;
    }

    # Redirect root to /hakolect/
    location = / {
        return 301 /hakolect/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
